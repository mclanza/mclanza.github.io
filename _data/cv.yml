  title:
    es: "Trayectoria Ejecutiva"
    en: "Executive Trajectory"
  role:
    es: "Senior Engineering Manager (Líder de Unidad de Negocios)"
    en: "Senior Engineering Manager (Business Unit Leader)"
  company: "IBM Argentina"
  period: 
    es: "Mayo 2016 — Diciembre 2025"
    en: "May 2016 — December 2025"
  impact_title:
    es: "Impacto:"
    en: "Impact:"
  impact:
    es: "Liderazgo integral de la unidad de investigación, escalando el equipo de 10 a 24 profesionales de alta especialización. Como Senior Manager, lideré una estructura jerárquica que incluyó la formación y supervisión de 3 People Managers (2 Software Engineers y 1 PhD), asegurando la escalabilidad operativa y el desarrollo de liderazgo interno."
    en: "Full leadership of the research unit, scaling the team from 10 to 24 highly specialized professionals. As a Senior Manager, I led a hierarchical structure that included mentoring and supervising 3 People Managers (2 Software Engineers and 1 PhD), ensuring operational scalability and internal leadership development."
  details:
    es: "Gestión de talento, finanzas y contratos, asegurando un entorno de alto rendimiento y excelencia técnica para equipos distribuidos (full remote)."
    en: "Talent management, finance, and contracts, ensuring a high-performance environment and technical excellence for distributed teams (full remote)."

