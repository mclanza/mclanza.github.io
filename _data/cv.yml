# Profile with Focus on Direction and Strategy
profile:
  es: "Líder de Equipos de Ingeniería y Gestión Estratégica con un enfoque centrado en el desarrollo de personas y una sólida base en sistemas complejos. Mi trayectoria se define por la capacidad de transformar equipos técnicos en unidades de alto rendimiento, habiendo escalado y liderado grupos de excelencia en entornos de investigación de vanguardia como IBM.
      Aporto una combinación de criterio técnico fundamental y liderazgo empático. Me especializo en cultivar culturas de trabajo saludables, liderar a otros gerentes de personas y asegurar que la ejecución tecnológica esté alineada con los objetivos estratégicos, aportando la madurez necesaria para guiar proyectos ambiciosos a través del crecimiento humano y profesional del equipo."
  en: "Engineering leader with a focus on people development and a strong foundation in complex systems. My trajectory is defined by the ability to transform technical teams into high-performance units, having scaled and led groups of excellence in cutting-edge research environments like IBM.
      I bring a combination of fundamental technical judgment and empathetic leadership. I specialize in cultivating healthy work cultures, leading other people managers, and ensuring that technological execution is aligned with strategic objectives, providing the maturity needed to guide ambitious projects through the human and professional growth of the team."

# Experience - Prioritizing Management Impact
executive_experience:
  title:
    es: "Trayectoria Ejecutiva"
    en: "Executive Trajectory"
  role:
    es: "Senior Engineering Manager & Site Lead (IBM Research Argentina)"
    en: "Senior Engineering Manager & Site Lead (IBM Research Argentina)"
  company: "IBM Argentina"
  period: 
    es: "Mayo 2016 — Diciembre 2025"
    en: "May 2016 — December 2025"
  impact_title:
    es: "Impacto:"
    en: "Impact:"
  impact:
    es: "Dirección estratégica y escalamiento del equipo hasta lograr el reconocimiento oficial como el Laboratorio de Investigación de IBM en Argentina. Bajo mi liderazgo, la unidad creció un 140% (de 10 a 24 especialistas), consolidándose como una potencia de Research regional en partnership con Brasil. Como Senior Manager, desarrollé un pipeline de talento que resultó en la promoción de 3 ingenieros (incluyendo perfiles PhD) a roles de Management. Gestioné íntegramente finanzas, contratos y operaciones estratégicas, asegurando un entorno de alto rendimiento para equipos distribuidos (full remote) alineado con los objetivos de innovación global."
    en: "Strategic direction and scaling of the team until achieving official recognition as IBM's Research Lab in Argentina. Under my leadership, the unit grew by 140% (from 10 to 24 specialists), establishing itself as a regional Research powerhouse in partnership with Brazil. As Senior Manager, I developed a talent pipeline that resulted in the promotion of 3 engineers (including PhD profiles) to Management roles. I fully managed finance, contracts, and strategic operations, ensuring a high-performance environment for distributed teams (full remote) aligned with global innovation objectives."
  details:
    es: "Foco en la construcción de culturas de alto rendimiento, mentoreo de líderes y optimización de procesos operativos para ingeniería de escala global."
    en: "Focus on building high-performance cultures, mentoring leaders, and optimizing operational processes for global-scale engineering."

